; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
extra_configs = platformio.local*.ini

[env:heltec_wifi_lora_32_V4]
platform = espressif32
board = heltec_wifi_lora_32_V4
framework = arduino
board_build.variants_dir = variants
board_build.variant = heltec_V4

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

lib_deps =
  # Exact version
  heltecautomation/Heltec ESP32 Dev-Boards @ 2.1.7

build_flags =
	-D REGION_US915
	-D ACTIVE_REGION=LORAMAC_REGION_US915
	-D MCU_ESP32_S3
	-D HELTEC_BOARD=30
	-D SLOW_CLK_TPYE=0
	-D WIFI_LORA_32_V4
	-D RADIO_CHIP_SX1262
	-D LoRaWAN_DEBUG_LEVEL=0
	-D LORAWAN_PREAMBLE_LENGTH=8
	-D LORAWAN_DEVEUI_AUTO=1
	-D LORA_RX_LNA=1
	-D USE_NONE_PA
	-D HELTEC_WIFI_LORA_32_V4
	-D GPIO_PIN_COUNT=SOC_GPIO_PIN_COUNT

# extra_scripts = post:pio_on_build.py
